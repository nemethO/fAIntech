<!DOCTYPE html>
<html lang="hu" class="dark">

    <title>{% block title %}fAIntech{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f1117',
                            card: '#1a1d2e',
                            border: '#2a2d3e',

</html>

<!-- sidebar + felso nav komponens -->
<!-- mobil menu gomb -->
<button id="sidebarToggle" class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-dark-card border border-dark-border rounded-lg">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
</button>

<!-- overlay mobilra -->
<div id="sidebarOverlay" class="lg:hidden fixed inset-0 bg-black/50 z-30 hidden"></div>

<!-- sidebar -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-dark-card border-r border-dark-border z-40
                           transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="flex flex-col h-full">
        <!-- logo -->
        <div class="p-6 border-b border-dark-border">
            <h1 class="text-xl font-bold text-primary-light">fAIntech</h1>
        </div>

        <!-- menu -->
        <nav class="flex-1 p-4 space-y-1">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-3 px-3">Főmenü</p>

            <a href="{{ url_for('dashboard.index') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('dashboard') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/>
                </svg>
                Dashboard
            </a>

            <a href="{{ url_for('transactions.list_transactions') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('transactions') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                Tranzakciók
            </a>

            <a href="{{ url_for('imports.upload_page') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('imports') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                Importálás
            </a>

            <a href="{{ url_for('budget.budget_page') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('budget') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8v2m0 8v2m0-10V6m0 12v2"/>
                </svg>
                Költségkeret
            </a>

            <a href="{{ url_for('analytics.analytics_page') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('analytics') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                Analitika
            </a>

            <a href="{{ url_for('chat.chat_page') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('chat') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                AI Asszisztens
            </a>
        </nav>

        <!-- also resz: beallitasok + profil -->
        <div class="p-4 border-t border-dark-border space-y-1">
            <a href="{{ url_for('settings.settings_page') }}"
               class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                      {% if request.endpoint and request.endpoint.startswith('settings') %}active text-white{% else %}text-gray-300{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Beállítások
            </a>

            {% if current_user.is_authenticated %}
            <div class="flex items-center gap-3 px-3 py-3 mt-2">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-sm font-bold text-white">
                    {{ current_user.name[0:2]|upper }}
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate">{{ current_user.name }}</p>
                    <p class="text-xs text-gray-500 truncate">{{ current_user.email }}</p>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</aside>

<!-- sidebar toggle script -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (!toggle) return;
    toggle.addEventListener('click', () => {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    });
});
</script>

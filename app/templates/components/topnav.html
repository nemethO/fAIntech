<!-- felso navigacios sav -->
<header class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold">{% block page_title %}{% endblock %}</h1>
    <div class="flex items-center gap-3">
        <!-- ertesites gomb -->
        <button class="p-2 rounded-lg bg-dark-card border border-dark-border hover:bg-dark-hover transition relative">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            {% if alert_count is defined and alert_count > 0 %}
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center">{{ alert_count }}</span>
            {% endif %}
        </button>
        <!-- profil badge -->
        {% if current_user.is_authenticated %}
        <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-sm font-bold text-white">
            {{ current_user.name[0:2]|upper }}
        </div>
        {% endif %}
    </div>
</header>
